server:
  host: 0.0.0.0
  port: 7876
robot_profiles:
  root: ../adapters/robots
  active: x1
simulation:
  headless: false
  with_control: true
  debug_joints: false
ros:
  enabled: true
  domain_id: 14
  node_name: hc_teleop_middleware
  command_mux:
    enabled: true
    source: vr
    vr_topic: /control/vr/joint_states
    exoskeleton_topic: /control/exoskeleton/joint_states
    output_topic: /action/joint_states
    control_source_topic: /control/source
    hardware_ready_topic: /status/hardware/ready
  subscriptions:
  - topic: /observation/cameras/wrist_left/color
    description: 左腕部相机彩色图像，随第 7 关节运动
    type: sensor_msgs/msg/Image
    enabled: false
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
    qos_reliability: reliable
  - topic: /observation/cameras/wrist_left/color/compressed
    description: 左腕部相机彩色图像，随第 7 关节运动（仿真进程内 JPEG 压缩，保留采集时间）
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
    qos_reliability: best_effort
  - topic: /observation/cameras/wrist_left/camera_info
    description: 左腕部相机内参与光学坐标系
    type: sensor_msgs/msg/CameraInfo
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/cameras/wrist_right/color
    description: 右腕部相机彩色图像，随第 7 关节运动
    type: sensor_msgs/msg/Image
    enabled: false
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
    qos_reliability: reliable
  - topic: /observation/cameras/wrist_right/color/compressed
    description: 右腕部相机彩色图像，随第 7 关节运动（仿真进程内 JPEG 压缩，保留采集时间）
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
    qos_reliability: best_effort
  - topic: /observation/cameras/wrist_right/camera_info
    description: 右腕部相机内参与光学坐标系
    type: sensor_msgs/msg/CameraInfo
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/left_arm/joint_states
    description: 左机械臂实际关节反馈，按关节名称排列
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/right_arm/joint_states
    description: 右机械臂实际关节反馈，按关节名称排列
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/waist/joint_states
    description: 腰部实际关节反馈，X1 对应 leg_1、leg_2、zhi
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/left_arm/ee_pose
    description: 左臂末端反馈位姿，由控制节点本地模型计算
    type: geometry_msgs/msg/PoseStamped
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/right_arm/ee_pose
    description: 右臂末端反馈位姿，由控制节点本地模型计算
    type: geometry_msgs/msg/PoseStamped
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/left_arm/joint_states
    description: 左机械臂最终下发的关节目标，按关节名称排列
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/right_arm/joint_states
    description: 右机械臂最终下发的关节目标，按关节名称排列
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/waist/joint_states
    description: 腰部最终关节控制目标，X1 对应 leg_1、leg_2、zhi
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/left_arm/ee_pose
    description: 左臂末端目标位姿，与末端反馈使用相同参考坐标系
    type: geometry_msgs/msg/PoseStamped
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/right_arm/ee_pose
    description: 右臂末端目标位姿，与末端反馈使用相同参考坐标系
    type: geometry_msgs/msg/PoseStamped
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/base/pose
    description: 底盘实际位置与朝向，用于轨迹和移动距离分析
    type: geometry_msgs/msg/PoseStamped
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/base/velocity
    description: 底盘命令的结构化速度：前向、横向及偏航角速度
    type: geometry_msgs/msg/TwistStamped
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/headset/pose
    description: 头显在 VR 跟踪坐标系中的位姿，不是机器人头部反馈
    type: geometry_msgs/msg/PoseStamped
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /vrdata
    description: 原始头显和双手位姿、按键、跟踪状态及 VR 时间戳
    type: std_msgs/msg/String
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /clock
    description: 仿真时钟，用于区分仿真时间与实际录制时间
    type: rosgraph_msgs/msg/Clock
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /status/hardware/ready
    description: 硬件就绪信号，供控制器判断是否允许下发命令
    type: std_msgs/msg/Bool
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 100.0
    event_max_hz: 20.0
  - topic: /status/teleop
    description: 遥操作状态，包括离合、反馈有效性及控制状态
    type: std_msgs/msg/String
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 10.0
    event_max_hz: 0.0
  - topic: /tf
    description: 各坐标系之间的动态变换，用于位姿转换与回放
    type: tf2_msgs/msg/TFMessage
    enabled: false
    outputs:
    - record
    max_hz: 20.0
    event_max_hz: 0.0
  - topic: /observation/joint_states
    description: 机器人整机关节反馈
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 0.0
    event_max_hz: 20.0
  - topic: /control/solver/joint_targets
    description: 逆解控制器输出的关节目标，尚未经过最终命令仲裁
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/joint_states
    description: 最终下发给机器人的整机关节目标
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 0.0
    event_max_hz: 20.0
  - topic: /control/solver/ee_targets
    description: 发送到求解器任务坐标系的末端目标位姿
    type: geometry_msgs/msg/PoseArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/ee_poses
    description: 双臂末端目标位姿，顺序为右臂、左臂
    type: geometry_msgs/msg/PoseArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/ee_poses
    description: 本地模型计算的双臂末端反馈位姿，顺序为右臂、左臂
    type: geometry_msgs/msg/PoseArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/base/command
    description: 最终底盘速度命令，顺序为偏航、前向、横向
    type: std_msgs/msg/Float64MultiArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/left_hand/joint_states
    description: 左手夹爪或灵巧手的关节控制目标
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /action/right_hand/joint_states
    description: 右手夹爪或灵巧手的关节控制目标
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/cameras/head/color/compressed
    description: 头部相机彩色图像压缩流，用于观察与录制
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/cameras/head/depth/compressed
    description: 头部相机深度图像压缩流，用于观察与录制
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /cameras/eye/color
    description: Isaac 头部相机原始彩色图像，用于头显投射与录制
    type: sensor_msgs/msg/Image
    enabled: false
    outputs:
    - websocket
    - record
    max_hz: 30.0
    event_max_hz: 0.0
    qos_reliability: reliable
  - topic: /cameras/eye/color/compressed
    description: Isaac 头部相机原始彩色图像，用于头显投射与录制（仿真进程内 JPEG 压缩，保留采集时间）
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 0.0
    event_max_hz: 0.0
    qos_reliability: best_effort
  - topic: /observation/cameras/overhead/color/compressed
    description: 俯视相机彩色图像压缩流，用于观察与录制
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /cameras/Bfront/color
    description: Bfront 相机原始彩色图像
    type: sensor_msgs/msg/Image
    enabled: false
    outputs:
    - record
    max_hz: 30.0
    event_max_hz: 0.0
  - topic: /observation/cameras/d405_left/color/compressed
    description: 左侧 D405相机彩色图像压缩流，用于观察与录制
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/cameras/d405_right/color/compressed
    description: 右侧 D405相机彩色图像压缩流，用于观察与录制
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/cameras/d405_left/depth/compressed
    description: 左侧 D405相机深度图像压缩流，用于观察与录制
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /observation/cameras/d405_right/depth/compressed
    description: 右侧 D405相机深度图像压缩流，用于观察与录制
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /cameras/stereo/color/compressed
    description: 双目相机拼接彩色压缩图像，用于双目观察与录制
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  recording:
    directory: ../runtime/topic_recordings
    format: both
    lerobot_fps: 15
    lerobot_task: 遥操作
    enabled: false
  dataset_topics:
    enabled: true
vr:
  enabled: true
  listen_host: 0.0.0.0
  pose_port: 5005
  discovery_port: 5006
  outbound_host: ''
  outbound_port: 5007
  pose_timeout_ms: 600
  publish_to_ros: true
  data_topic: /vrdata
safety:
  enabled: true
  stop_on_startup: false
  stop_topic: /control/emergency_stop
camera:
  enabled: true
  source: ros
  topic: /cameras/eye/color
  custom_topic: ''
  streams:
  - id: head
    name: 头部双目相机
    topic: /cameras/stereo/color/compressed
    stereo: true
    enabled: true
    custom_topic: ''
    width: 1280
    height: 400
    fps: 30
    codec: H264
    type: sensor_msgs/msg/CompressedImage
  - id: overhead
    name: 俯视相机
    topic: /cameras/eye/color/compressed
    enabled: true
    custom_topic: ''
    width: 640
    height: 400
    fps: 30
    codec: H264
    type: sensor_msgs/msg/CompressedImage
  - id: d405_left
    name: 左腕相机
    topic: /observation/cameras/wrist_left/color/compressed
    enabled: true
    custom_topic: ''
    width: 640
    height: 400
    fps: 30
    codec: H264
    type: sensor_msgs/msg/CompressedImage
  - id: d405_right
    name: 右腕相机
    topic: /observation/cameras/wrist_right/color/compressed
    enabled: true
    custom_topic: ''
    width: 640
    height: 400
    fps: 30
    codec: H264
    type: sensor_msgs/msg/CompressedImage
  width: 640
  height: 400
  fps: 30
  codec: H264
