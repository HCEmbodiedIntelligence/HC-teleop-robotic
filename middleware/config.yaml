server:
  host: 0.0.0.0
  port: 7876
robot_profiles:
  root: ../adapters/robots
  active: x1
ros:
  enabled: true
  domain_id: 13
  node_name: hc_teleop_middleware
  command_mux:
    enabled: true
    source: vr
    vr_topic: /hc_teleop/joint_cmd_vr
    exoskeleton_topic: /hc_teleop/joint_cmd_exoskeleton
    output_topic: /hc_teleop/joint_cmd
    control_source_topic: /hc_teleop/control_source
    hardware_ready_topic: /hc_teleop/hardware_ready
  subscriptions:
  - topic: /hc_teleop/hardware_ready
    type: std_msgs/msg/Bool
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 100.0
    event_max_hz: 20.0
  - topic: /teleop/arm/status
    type: std_msgs/msg/String
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 10.0
    event_max_hz: 0.0
  - topic: /tf
    type: tf2_msgs/msg/TFMessage
    enabled: false
    outputs:
    - record
    max_hz: 20.0
    event_max_hz: 0.0
  - topic: /hc_teleop/joint_states
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 0.0
    event_max_hz: 20.0
  - topic: /hc_teleop/joint_cmd_arm
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/joint_cmd
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 0.0
    event_max_hz: 20.0
  - topic: /hc_teleop/controller_target_ee_poses
    type: geometry_msgs/msg/PoseArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/target_ee_poses
    type: geometry_msgs/msg/PoseArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/actual_ee_poses
    type: geometry_msgs/msg/PoseArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/sol_q
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/target_base_move
    type: std_msgs/msg/Float64MultiArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/joint_cmd_finger_left
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/joint_cmd_finger_right
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/camera_head/color/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/camera_head/depth/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /cameras/eye/color
    type: sensor_msgs/msg/Image
    enabled: false
    outputs:
    - record
    max_hz: 30.0
    event_max_hz: 0.0
  - topic: /hc_teleop/camera_overhead/color/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /cameras/Bfront/color
    type: sensor_msgs/msg/Image
    enabled: false
    outputs:
    - record
    max_hz: 30.0
    event_max_hz: 0.0
  - topic: /hc_teleop/camera_d405_left/color/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/camera_d405_right/color/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/camera_d405_left/depth/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  - topic: /hc_teleop/camera_d405_right/depth/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 0.0
    event_max_hz: 0.0
  recording:
    directory: ../runtime/topic_recordings
    enabled: false
vr:
  enabled: true
  listen_host: 0.0.0.0
  pose_port: 5005
  discovery_port: 5006
  outbound_host: ''
  outbound_port: 5007
  pose_timeout_ms: 600
  publish_to_ros: true
  data_topic: /vrdata
safety:
  enabled: true
  stop_on_startup: false
  stop_topic: /teleop/emergency_stop
camera:
  enabled: true
  source: ros
  topic: /hc_teleop/camera_head/color/compressed
  custom_topic: ''
  streams:
  - id: head
    name: 头部相机
    topic: /hc_teleop/camera_head/color/compressed
    enabled: true
    custom_topic: ''
    width: 640
    height: 400
    fps: 30
    codec: H264
  - id: overhead
    name: 俯视相机
    topic: /hc_teleop/camera_overhead/color/compressed
    enabled: true
    custom_topic: ''
    width: 640
    height: 400
    fps: 30
    codec: H264
  - id: d405_left
    name: 左腕相机
    topic: /hc_teleop/camera_d405_left/color/compressed
    enabled: true
    custom_topic: ''
    width: 640
    height: 400
    fps: 30
    codec: H264
  - id: d405_right
    name: 右腕相机
    topic: /hc_teleop/camera_d405_right/color/compressed
    enabled: true
    custom_topic: ''
    width: 640
    height: 400
    fps: 30
    codec: H264
  width: 640
  height: 400
  fps: 30
  codec: H264
