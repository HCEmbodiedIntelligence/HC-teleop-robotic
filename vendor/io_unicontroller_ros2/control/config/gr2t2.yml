ros_interface:
  node_name: controller_v2_2
  rate: 400
  sub_topic:
    joint_state: "/io_teleop/joint_states"
    tf_target: "/io_align/tf"
    ee_target: "/io_teleop/ee_poses"
  pub_topic:
    joint_target: "/io_teleop/joint_cmd"
control:
  method: "control" # retarget / control
  dt: 0.0025
  joints_init: []
model:
  urdf: GR2T2v2_fourier_hand_6dof.urdf
  free_joints: [
                # waist
                "waist_yaw_joint",
                # head
                "head_yaw_joint",
                "head_pitch_joint",
                # left arm
                "left_shoulder_pitch_joint",
                "left_shoulder_roll_joint",
                "left_shoulder_yaw_joint",
                "left_elbow_pitch_joint",
                "left_wrist_yaw_joint",
                "left_wrist_pitch_joint",
                "left_wrist_roll_joint",
                # right arm
                "right_shoulder_pitch_joint",
                "right_shoulder_roll_joint",
                "right_shoulder_yaw_joint",
                "right_elbow_pitch_joint",
                "right_wrist_yaw_joint",
                "right_wrist_pitch_joint",
                "right_wrist_roll_joint",
                # left leg
                "left_hip_pitch_joint",
                "left_hip_roll_joint",
                "left_hip_yaw_joint",
                "left_knee_pitch_joint",
                "left_ankle_pitch_joint",
                "left_ankle_roll_joint",
                # right leg
                "right_hip_pitch_joint",
                "right_hip_roll_joint",
                "right_hip_yaw_joint",
                "right_knee_pitch_joint",
                "right_ankle_pitch_joint",
                "right_ankle_roll_joint",
              ]
task:
  pose: [
          [["base_link", "left_hand_roll_link"], 0.0, 1.0],
          [["base_link", "right_hand_roll_link"], 0.0, 1.0],
          [["base_link", "left_thigh_yaw_link"], 0.0, 1.0],
          [["base_link", "right_thigh_yaw_link"], 0.0, 1.0],
          [["base_link", "left_foot"], 50.0, 5.0],
          [["base_link", "right_foot"], 50.0, 5.0],
        ]
  axis: [
          [["base_link", "torso_link"], "X", 40.0],
          [["base_link", "head_pitch_link"], "X", 1.0],
          [["base_link", "left_upper_arm_roll_link"], "Z", 20.0],
          [["base_link", "left_lower_arm_pitch_link"], "Z", 20.0],
          [["base_link", "right_upper_arm_roll_link"], "Z", 20.0],
          [["base_link", "right_lower_arm_pitch_link"], "Z", 20.0],
          [["base_link", "left_shank_pitch_link"], "Z", 1.0],
          [["base_link", "right_shank_pitch_link"], "Z", 1.0],
        ]
  joint: [
          # [[right_shoulder_roll_joint], 100.0]
        ]
limit:
  velocity: [360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360]
  