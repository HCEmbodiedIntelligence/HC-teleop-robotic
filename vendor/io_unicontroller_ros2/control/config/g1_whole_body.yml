ros_interface:
  node_name: controller_v2_2
  rate: 400
  sub_topic:
    joint_state: "/io_teleop/joint_states"
    tf_target: "/io_align/tf"
    ee_target: "/io_teleop/ee_poses"
  pub_topic:
    joint_target: "/io_teleop/joint_cmd"
control:
  method: "control" # retarget / control
  dt: 0.0025
  joints_init: []
model:
  urdf: g1_29dof_rev_1_0_with_inspire_hand_DFQ.urdf
  free_joints: [
                # waist
                "waist_yaw_joint",
                "waist_roll_joint",
                "waist_pitch_joint",
                # left arm
                "left_shoulder_pitch_joint",
                "left_shoulder_roll_joint",
                "left_shoulder_yaw_joint",
                "left_elbow_joint",
                "left_wrist_roll_joint",
                "left_wrist_pitch_joint",
                "left_wrist_yaw_joint",
                # right arm
                "right_shoulder_pitch_joint",
                "right_shoulder_roll_joint",
                "right_shoulder_yaw_joint",
                "right_elbow_joint",
                "right_wrist_roll_joint",
                "right_wrist_pitch_joint",
                "right_wrist_yaw_joint",
                # left leg
                "left_hip_pitch_joint",
                "left_hip_roll_joint",
                "left_hip_yaw_joint",
                "left_knee_joint",
                "left_ankle_pitch_joint",
                "left_ankle_roll_joint",
                # right leg
                "right_hip_pitch_joint",
                "right_hip_roll_joint",
                "right_hip_yaw_joint",
                "right_knee_joint",
                "right_ankle_pitch_joint",
                "right_ankle_roll_joint",
              ]
task:
  pose: [
          [["pelvis", "left_wrist_yaw_link"], 0.0, 1.0, 0.1],
          [["pelvis", "right_wrist_yaw_link"], 0.0, 1.0, 0.1],
          [["pelvis", "torso_link"], 0.0, 40.0, 0.1],
          [["pelvis", "left_hip_yaw_link"], 0.0, 1.0, 0.1],
          [["pelvis", "right_hip_yaw_link"], 0.0, 1.0, 0.1],
          [["pelvis", "left_foot"], 50.0, 5.0, 0.1],
          [["pelvis", "right_foot"], 50.0, 5.0, 0.1],
        ]
  axis: [
          [["pelvis", "left_shoulder_roll_link"], "Z", 20.0, 0.1],
          [["pelvis", "left_elbow_link"], "X", 20.0, 0.1],
          [["pelvis", "right_shoulder_roll_link"], "Z", 20.0, 0.1],
          [["pelvis", "right_elbow_link"], "X", 20.0, 0.1],
          [["pelvis", "left_knee_link"], "Z", 1.0, 0.1],
          [["pelvis", "right_knee_link"], "Z", 1.0, 0.1],
          # [["pelvis", "left_shoulder_pitch_link"], "Z", 1.0, 0.1],
          # [["pelvis", "right_shoulder_pitch_link"], "Z", 1.0, 0.1],
        ]
  joint: [
          # [[right_shoulder_roll_joint], 100.0, 0.1]
        ]
limit:
  velocity: [360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360,360]
  