# SDK uses degrees for joints and millimetres for translation.
# RuntimeSdkConfig replaces model_path with the registered robot URDF.
model_path: ../urdf/hc_tj_robot.urdf
joint_groups:
  left_arm:
  - Joint1_L
  - Joint2_L
  - Joint3_L
  - Joint4_L
  - Joint5_L
  - Joint6_L
  - Joint7_L
  right_arm:
  - Joint1_R
  - Joint2_R
  - Joint3_R
  - Joint4_R
  - Joint5_R
  - Joint6_R
  - Joint7_R
  whole_body:
  - Joint1_L
  - Joint2_L
  - Joint3_L
  - Joint4_L
  - Joint5_L
  - Joint6_L
  - Joint7_L
  - Joint1_R
  - Joint2_R
  - Joint3_R
  - Joint4_R
  - Joint5_R
  - Joint6_R
  - Joint7_R
tools: []
planning:
  offline_planning_backend: rmp
  sample_period_sec: 0.01
  limit_scale: 1.0
  ik:
    solver: qp_servo
    qp_servo:
      gain: 1.0              # 遥操跟踪增益
      joint_v_max_deg: 130.0 # 与 rtc.max_velocity 匹配的关节速度约束
      damping: 0.002         # 奇异阻尼
      iterations: 1
    placo:
      max_iterations: 1000
      position_tolerance: 1.0
      orientation_tolerance: 0.015
      enable_tolerance_check: true
      frame_task_priority: soft
      frame_position_weight: 1.0
      frame_orientation_weight: 1.0
      solver_dt_sec: 0.01
      enable_regularization_task: true
      regularization_task_weight: 0.0005
      enable_manipulability_task: false
      enable_joint_task: true
      joint_task_weight: 0.001
      enable_joint_limits: true
      mask_floating_base: true
wbc:
  active_group: whole_body
  active_joint_names:
  - Joint1_L
  - Joint2_L
  - Joint3_L
  - Joint4_L
  - Joint5_L
  - Joint6_L
  - Joint7_L
  - Joint1_R
  - Joint2_R
  - Joint3_R
  - Joint4_R
  - Joint5_R
  - Joint6_R
  - Joint7_R
rmp:
  cartesian_max_linear_velocity: 100.0
  groups:
    left_arm:
      joint_max_velocity:
      - 35.0
      - 35.0
      - 35.0
      - 35.0
      - 35.0
      - 35.0
      - 35.0
      joint_max_acceleration:
      - 140.0
      - 140.0
      - 140.0
      - 140.0
      - 140.0
      - 140.0
      - 140.0
      cartesian_max_linear_velocity: 100.0
    right_arm:
      joint_max_velocity:
      - 35.0
      - 35.0
      - 35.0
      - 35.0
      - 35.0
      - 35.0
      - 35.0
      joint_max_acceleration:
      - 140.0
      - 140.0
      - 140.0
      - 140.0
      - 140.0
      - 140.0
      - 140.0
      cartesian_max_linear_velocity: 100.0
rtc:
  input_cutoff_hz: 100.0
  output_rate_hz: 100.0
  max_velocity: 130.0
  max_acceleration: 1200.0
  max_jerk: 0.0
  cartesian_max_linear_velocity: 1000.0
  cartesian_max_linear_acceleration: 8000.0
  cartesian_max_linear_jerk: 0.0
  cartesian_max_angular_velocity: 4.0
  cartesian_max_angular_acceleration: 30.0
  cartesian_max_angular_jerk: 0.0
  cartesian_mode: smooth_xyz
execution:
  driver: mock
  initial_state:
    joint_groups:
      left_arm:
      - 82.5059225
      - -44.11775023
      - -82.5059225
      - -89.95437384
      - 0.0
      - 0.0
      - 0.0
      right_arm:
      - -82.5059225
      - -44.11775023
      - 82.5059225
      - -89.95437384
      - 0.0
      - 0.0
      - 0.0
