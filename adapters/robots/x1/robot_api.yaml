# Public/model SI boundary. Arm order and home are referenced, never duplicated.
schema: hc-robot-api/v1
groups:
  left_arm:
    model_joints_from: arms.left.joint_names
    public_name_prefix: left_joint_
  right_arm:
    model_joints_from: arms.right.joint_names
    public_name_prefix: right_joint_
  whole_body:
    combine:
    - left_arm
    - right_arm
  waist:
    model_joints_from: body.waist_joint_names
    public_name_prefix: waist_joint_
auxiliary_joints:
  head_1: head_joint_1
  head_2: head_joint_2
  L_ban: left_gripper_joint_1
  R_ban: right_gripper_joint_1
  left_wheel_1: left_wheel_joint_1
  left_wheel_2: left_wheel_joint_2
  left_wheel_3: left_wheel_joint_3
  left_wheel_4: left_wheel_joint_4
  right_wheel_1: right_wheel_joint_1
  right_wheel_2: right_wheel_joint_2
  right_wheel_3: right_wheel_joint_3
  right_wheel_4: right_wheel_joint_4
hand_servo_j:
  left:
    command_semantics: absolute_joint_position
    unit: rad
    joints:
      L_thumb_roll_joint: left_thumb_roll_joint
      L_thumb_abad_joint: left_thumb_abad_joint
      L_thumb_mcp_joint: left_thumb_mcp_joint
      L_index_abad_joint: left_index_abad_joint
      L_index_pip_joint: left_index_pip_joint
      L_middle_pip_joint: left_middle_pip_joint
      L_ring_abad_joint: left_ring_abad_joint
      L_ring_pip_joint: left_ring_pip_joint
      L_pinky_abad_joint: left_pinky_abad_joint
      L_pinky_pip_joint: left_pinky_pip_joint
  right:
    command_semantics: absolute_joint_position
    unit: rad
    joints:
      R_thumb_roll_joint: right_thumb_roll_joint
      R_thumb_abad_joint: right_thumb_abad_joint
      R_thumb_mcp_joint: right_thumb_mcp_joint
      R_index_abad_joint: right_index_abad_joint
      R_index_pip_joint: right_index_pip_joint
      R_middle_pip_joint: right_middle_pip_joint
      R_ring_abad_joint: right_ring_abad_joint
      R_ring_pip_joint: right_ring_pip_joint
      R_pinky_abad_joint: right_pinky_abad_joint
      R_pinky_pip_joint: right_pinky_pip_joint
joint_overrides: {}
poses:
  home:
    model_positions_from: robot.initial_joints
driver:
  kind: humanoid_driver_runtime
  groups:
  - left_arm
  - right_arm
  - waist
  parameters:
    plugin_class: humanoid_driver_runtime/RosTopicRobotDriver
    plugin_parameters:
    - state_topic=/x1/joint_states
    - command_topic.left_arm=/x1/left_arm/commands
    - command_topic.right_arm=/x1/right_arm/commands
    - command_topic.waist=/x1/waist/commands
    - command_topic.head=/x1/head/commands
    - state_timeout_s=0.25
    - startup_grace_s=3.0
    command_max_age_ms: 100
    feedback_max_age_ms: 200
    hardware_ready_topic: /status/hardware/ready
    emergency_stop_topic: /control/emergency_stop
