camera:
  enabled: false
  source: ros
  topic: /observation/cameras/head/color/compressed
  custom_topic: ''
  streams: []
  width: 640
  height: 400
  fps: 30
  codec: H264
safety:
  enabled: true
  stop_on_startup: true
  stop_topic: /control/emergency_stop
ros:
  subscriptions:
  - topic: /observation/joint_states
    description: ''
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 0.0
    event_max_hz: 20.0
  - topic: /action/joint_states
    description: ''
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 0.0
    event_max_hz: 20.0
  command_mux:
    enabled: true
    source: vr
    vr_topic: /control/vr/joint_states
    exoskeleton_topic: /control/exoskeleton/joint_states
    output_topic: /action/joint_states
    control_source_topic: /control/source
    hardware_ready_topic: /status/hardware/ready
    hardware_enable_topic: /control/hardware/enabled
    motion_topic: /control/motion/joint_targets
    motion_permit_topic: /control/motion/permit
    hardware_ready_timeout_sec: 0.5
  intervention:
    legacy_topics: false
    automatic_recording: true
    max_arm_velocity_rad_s: 0.25
    max_target_error_rad: 0.3
vr:
  pose_timeout_ms: 600
  web_pose_hz: 10.0
