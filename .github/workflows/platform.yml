name: Process platform
on: [push, pull_request]
jobs:
  isolated-platform:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - name: Build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends cmake g++ libeigen3-dev python3-pip ffmpeg libgl1
      - name: Install and build
        run: bash install.sh
      - name: Verify isolated processes and frontend
        run: bash platform/scripts/test.sh
