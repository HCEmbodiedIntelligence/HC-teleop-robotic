[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_hc_teleop"
version = "0.1.0"
description = "HC ServoJ robot and read-only demonstration devices for LeRobot"
requires-python = ">=3.12"
dependencies = ["lerobot", "numpy", "Pillow"]

[project.scripts]
hc-lerobot-record = "lerobot_robot_hc_teleop.record:main"

[tool.setuptools]
packages = ["lerobot_robot_hc_teleop"]
