server:
  host: 0.0.0.0
  port: 7876
robot_profiles:
  root: robot_configs
  active: hc_tj_description
ros:
  enabled: true
  domain_id: 13
  node_name: hc_teleop_middleware
  subscriptions:
  - topic: /teleop/arm/status
    type: std_msgs/msg/String
    enabled: true
    outputs:
    - websocket
    - record
    max_hz: 10.0
  - topic: /tf
    type: tf2_msgs/msg/TFMessage
    enabled: false
    outputs:
    - record
    max_hz: 20.0
  - topic: /hc_teleop/joint_states
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/joint_cmd_arm
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/joint_cmd
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/controller_target_ee_poses
    type: geometry_msgs/msg/PoseArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/target_ee_poses
    type: geometry_msgs/msg/PoseArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/actual_ee_poses
    type: geometry_msgs/msg/PoseArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/sol_q
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/target_base_move
    type: std_msgs/msg/Float64MultiArray
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/joint_cmd_finger_left
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/joint_cmd_finger_right
    type: sensor_msgs/msg/JointState
    enabled: true
    outputs:
    - record
    max_hz: 0.0
  - topic: /hc_teleop/camera_head/color/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 30.0
  - topic: /io_teleop/camera_head/color
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 30.0
  - topic: /cameras/eye/color
    type: sensor_msgs/msg/Image
    enabled: true
    outputs:
    - record
    max_hz: 30.0
  - topic: /hc_teleop/camera_overhead/color/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 30.0
  - topic: /cameras/Bfront/color
    type: sensor_msgs/msg/Image
    enabled: true
    outputs:
    - record
    max_hz: 30.0
  - topic: /hc_teleop/camera_d405_left/color/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 30.0
  - topic: /hc_teleop/camera_d405_right/color/compressed
    type: sensor_msgs/msg/CompressedImage
    enabled: true
    outputs:
    - record
    max_hz: 30.0
  recording:
    enabled: false
    directory: runtime/topic_recordings
vr:
  enabled: true
  listen_host: 0.0.0.0
  pose_port: 5005
  discovery_port: 5006
  outbound_host: ''
  outbound_port: 5007
  pose_timeout_ms: 600
  publish_to_ros: true
  data_topic: /vrdata
safety:
  enabled: true
  stop_on_startup: false
  stop_topic: /teleop/emergency_stop
camera:
  enabled: true
  source: ros
  topic: /hc_teleop/camera_head/color/compressed
  custom_topic: ''
  width: 640
  height: 400
  fps: 30
  codec: H264
